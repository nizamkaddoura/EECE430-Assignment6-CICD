
name: Inventory Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t inventory-agent-ci .

      - name: Run Django system checks
        run: docker run --rm inventory-agent-ci python manage.py check

      - name: Run Django tests
        run: docker run --rm inventory-agent-ci python manage.py test
